specificationVersion: 'jobtemplate-2023-09'
name: Bedrock Generation Fanout

# One task per clip. Each task names a provider and carries that provider's request body
# verbatim, so switching model, settings, or service is a template edit and never a worker
# code change. The durable Lambda workers in the customer-managed fleet dispatch the
# request and suspend, unbilled, until it finishes.
#
# Everything is a TASK parameter, never a job parameter. A worker receives task parameters
# directly in the `taskRun` session action, whereas job parameters have to be fetched with
# `BatchGetJobEntity`, which this worker deliberately does not do: a job parameter would
# silently never reach it.

steps:
- name: Generate
  parameterSpace:
    taskParameterDefinitions:
    # Single-valued, so it does not fan out. `sleep` is the credential-free provider, and
    # a worker rejects any name it does not know with a message listing the ones it does.
    - name: Provider
      type: STRING
      range: ["bedrock-async"]
    # The fan-out parameter. `modelId` and `modelInput` reach StartAsyncInvoke untouched,
    # so `modelInput` follows whatever schema the chosen model documents. Asynchronous
    # invocation is the video generation models; image models such as Nova Canvas are
    # synchronous only and cannot be polled.
    #
    # `modelId` comes last so the JSON never contains `}}`, which Open Job Description
    # reads as the end of an interpolation expression. Separate any other adjacent closing
    # braces with a space.
    - name: Request
      type: STRING
      range:
      - >-
        {"modelInput": {"prompt": "a red sports car driving along a coastal highway at
        sunset, cinematic",
        "duration": "5s", "resolution": "540p", "aspect_ratio": "16:9", "loop": false},
        "modelId": "luma.ray-v2:0"}
      - >-
        {"modelInput": {"prompt": "a slow aerial push over a misty pine forest at dawn",
        "duration": "5s", "resolution": "540p", "aspect_ratio": "16:9", "loop": false},
        "modelId": "luma.ray-v2:0"}
      - >-
        {"modelInput": {"prompt": "timelapse of storm clouds gathering over a desert mesa",
        "duration": "5s", "resolution": "540p", "aspect_ratio": "16:9", "loop": false},
        "modelId": "luma.ray-v2:0"}
  hostRequirements:
    attributes:
      # Restrict these tasks to the durable Lambda workers, which report this attribute in
      # their capabilities. Without it a conventional worker could be assigned a step it
      # has no way to run.
      - name: attr.durable.lambda
        anyOf: ["true"]
  script:
    actions:
      onRun:
        # A durable Lambda worker never runs this; it reads the task parameters instead.
        # Keeping the action meaningful means `openjd run` and a conventional worker both
        # show exactly which request would have been dispatched.
        command: bash
        args: ["{{Task.File.Report}}"]
    embeddedFiles:
    # The request is its own file so that no shell quoting can mangle the JSON.
    - name: RequestBody
      type: TEXT
      data: |
        {{Task.Param.Request}}
    - name: Report
      type: TEXT
      data: |
        echo "provider: {{Task.Param.Provider}}"
        echo "request:"
        cat "{{Task.File.RequestBody}}"
