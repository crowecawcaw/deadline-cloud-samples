AWSTemplateFormatVersion: "2010-09-09"
Description: Deadline Cloud service-managed fleet with FSx for OpenZFS

Parameters:
  FarmName:
    Type: String
    Default: example-deadline-farm
    Description: Name for the Deadline Cloud farm
  FleetName:
    Type: String
    Default: example-deadline-fleet
    Description: Name for the Deadline Cloud fleet
  QueueName:
    Type: String
    Default: example-deadline-queue
    Description: Name for the Deadline Cloud queue
  FSxClusterIP:
    Type: String
    Default: 10.0.1.100
    Description: IP address of the FSx cluster (update after initial deployment)

Resources:
  # VPC Infrastructure
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: deadline-vpc

  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: deadline-subnet-1

  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: deadline-subnet-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: deadline-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: deadline-rt

  Route:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref RouteTable

  # Deadline Cloud Resources
  DeadlineFarm:
    Type: AWS::Deadline::Farm
    Properties:
      DisplayName: !Ref FarmName

  FSxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for FSx OpenZFS and VPC Lattice
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: 10.0.0.0/16
          Description: NFS traffic
        - IpProtocol: tcp
          FromPort: 111
          ToPort: 111
          CidrIp: 10.0.0.0/16
          Description: RPC portmapper
        - IpProtocol: udp
          FromPort: 111
          ToPort: 111
          CidrIp: 10.0.0.0/16
          Description: RPC portmapper UDP
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic

  FSxFileSystem:
    Type: AWS::FSx::FileSystem
    Properties:
      FileSystemType: OPENZFS
      StorageCapacity: 64
      SubnetIds:
        - !Ref Subnet1
      SecurityGroupIds:
        - !Ref FSxSecurityGroup
      OpenZFSConfiguration:
        DeploymentType: SINGLE_AZ_1
        ThroughputCapacity: 64
        RootVolumeConfiguration:
          NfsExports:
            - ClientConfigurations:
                - Clients: "*"
                  Options:
                    - rw
                    - crossmnt
                    - insecure  # Allows NFS clients to use ports above 1024, required for some client configurations

  VPCLatticeResourceGateway:
    Type: AWS::VpcLattice::ResourceGateway
    Properties:
      Name: resource-gateway
      IpAddressType: IPV4
      VpcIdentifier: !Ref VPC
      SubnetIds:
        - !Ref Subnet1
        - !Ref Subnet2
      SecurityGroupIds:
        - !Ref FSxSecurityGroup

  VPCLatticeResourceConfiguration:
    Type: AWS::VpcLattice::ResourceConfiguration
    Properties:
      Name: resource-config
      AllowAssociationToSharableServiceNetwork: true
      ResourceConfigurationType: SINGLE
      ProtocolType: TCP
      PortRanges:
        - 1-65535
      ResourceGatewayId: !GetAtt VPCLatticeResourceGateway.Id
      ResourceConfigurationDefinition:
        IpResource: !Ref FSxClusterIP

  FleetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: credentials.deadline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Ref DeadlineFarm
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSDeadlineCloud-FleetWorker
      Policies:
        - PolicyName: FleetWorkerLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*:/aws/deadline/${DeadlineFarm.FarmId}/*
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia:
                      - deadline.amazonaws.com
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*:/aws/deadline/${DeadlineFarm.FarmId}/*

  QueueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: credentials.deadline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Ref DeadlineFarm
      Policies:
        - PolicyName: QueuePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: JobLogsReadOnly
                Effect: Allow
                Action:
                  - logs:GetLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/deadline/${DeadlineFarm.FarmId}/*
              - Sid: DeadlineServiceManagedFleetSoftwareAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource: "*"
                Condition:
                  ArnLike:
                    s3:DataAccessPointArn:
                      - arn:aws:s3:*:*:accesspoint/deadline-software-*
                  StringEquals:
                    s3:AccessPointNetworkOrigin: VPC

  DeadlineFleet:
    Type: AWS::Deadline::Fleet
    Properties:
      DisplayName: !Ref FleetName
      FarmId: !GetAtt DeadlineFarm.FarmId
      RoleArn: !GetAtt FleetRole.Arn
      MaxWorkerCount: 5
      MinWorkerCount: 0
      Configuration:
        ServiceManagedEc2:
          InstanceCapabilities:
            VCpuCount:
              Min: 1
              Max: 4
            MemoryMiB:
              Min: 512
              Max: 8192
            OsFamily: LINUX
            CpuArchitectureType: x86_64
          InstanceMarketOptions:
            Type: on-demand
          VpcConfiguration:
            ResourceConfigurationArns:
              - !GetAtt VPCLatticeResourceConfiguration.Arn
      HostConfiguration:
        ScriptBody: !Sub
          - |
            #!/bin/bash
            set -e

            echo "Setting up NFS mount for FSx via VPC Lattice"

            # Create mount point
            sudo mkdir -p /mnt/fsx

            # VPC Lattice endpoint
            NFS_DNS="${ResourceConfigId}.resource-endpoints.deadline.${AWS::Region}.amazonaws.com"
            echo "Mounting NFS from: $NFS_DNS"

            # Mount NFS share
            sudo mount -t nfs -o noatime,nfsvers=3,sync,nconnect=16,rsize=1048576,wsize=1048576,timeo=600,retrans=2 $NFS_DNS:/fsx /mnt/fsx

            echo "NFS mount successful"
            ls -la /mnt/fsx
          - ResourceConfigId: !GetAtt VPCLatticeResourceConfiguration.Id
        ScriptTimeoutSeconds: 300

  DeadlineQueue:
    Type: AWS::Deadline::Queue
    Properties:
      DisplayName: !Ref QueueName
      FarmId: !GetAtt DeadlineFarm.FarmId
      DefaultBudgetAction: STOP_SCHEDULING_AND_COMPLETE_TASKS
      RoleArn: !GetAtt QueueRole.Arn

  QueueFleetAssociation:
    Type: AWS::Deadline::QueueFleetAssociation
    Properties:
      FarmId: !GetAtt DeadlineFarm.FarmId
      QueueId: !GetAtt DeadlineQueue.QueueId
      FleetId: !GetAtt DeadlineFleet.FleetId

  ResourceShare:
    Type: AWS::RAM::ResourceShare
    Properties:
      Name: VPCLattice-Deadline-Share
      ResourceArns:
        - !GetAtt VPCLatticeResourceConfiguration.Arn
      Principals:
        - fleets.deadline.amazonaws.com
      Sources:
        - !Ref AWS::AccountId

Outputs:
  FarmId:
    Description: Deadline Farm ID
    Value: !Ref DeadlineFarm
  FleetId:
    Description: Deadline Fleet ID
    Value: !Ref DeadlineFleet
  QueueId:
    Description: Deadline Queue ID
    Value: !Ref DeadlineQueue
  FSxFileSystemId:
    Description: FSx File System ID
    Value: !Ref FSxFileSystem
  FSxDNSName:
    Description: FSx DNS Name for direct NFS mount
    Value: !GetAtt FSxFileSystem.DNSName
  VPCLatticeEndpoint:
    Description: VPC Lattice endpoint for NFS access via Deadline workers
    Value: !Sub ${VPCLatticeResourceConfiguration.Id}.resource-endpoints.deadline.${AWS::Region}.amazonaws.com
